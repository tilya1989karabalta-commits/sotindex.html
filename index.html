<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Сотовые аксессуары - Кара-Балта</title>
    <style>
        :root {
            --bg-color: #0e1621;
            --header-bg: #17212b;
            --user-msg-bg: #2b5278;
            --bot-msg-bg: #182533;
            --text-color: #ffffff;
            --text-muted: #7f91a4;
            --btn-bg: #2b5278;
            --accent-color: #2ea6ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Экрандын бийиктиги телефондун клавиатурасына жараша 100dvh колдонулду */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            height: 100dvh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            border-left: 1px solid #101921;
            border-right: 1px solid #101921;
        }

        /* HEADER */
        .header {
            background-color: var(--header-bg);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #101921;
            flex-shrink: 0;
        }

        .header-info h1 {
            font-size: 16px;
            font-weight: 500;
        }

        .header-info p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: #202b36;
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        /* PRICE TOGGLE */
        .price-toggle {
            background-color: #24313d;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 1px solid #101921;
            flex-shrink: 0;
        }

        /* CHAT AREA */
        .chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.user {
            background-color: var(--user-msg-bg);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            background-color: var(--bot-msg-bg);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .receipt-btn {
            background-color: #3a536d;
            border: none;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            margin-top: 10px;
            cursor: pointer;
            display: block;
            width: 100%;
            text-align: center;
            font-weight: bold;
        }
        
        .receipt-btn:active {
            background-color: #2b3b4a;
        }

        /* INPUT AREA */
        .input-wrapper {
            background-color: var(--header-bg);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
            border-top: 1px solid #101921;
        }

        .customer-name-input {
            background-color: #242f3d;
            border: 1px solid #3a536d;
            padding: 8px 12px;
            border-radius: 8px;
            color: white;
            font-size: 13px;
            outline: none;
            width: 100%;
        }

        .message-input-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-field {
            flex: 1;
            background-color: #242f3d;
            border: none;
            padding: 12px 15px;
            border-radius: 20px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .send-btn, .mic-btn {
            background-color: var(--btn-bg);
            border: none;
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 18px;
            flex-shrink: 0;
        }

        .mic-btn {
            background-color: var(--accent-color);
        }

        /* FOOTER */
        .footer {
            background-color: var(--bg-color);
            text-align: center;
            padding: 8px;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid #101921;
            flex-shrink: 0;
        }

        .footer span {
            color: #5288c1;
        }

        /* MODAL (Товар кошуу жана Чек үчүн) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--header-bg);
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            border: 1px solid #2b3b4a;
        }

        .modal-content h3 {
            margin-bottom: 15px;
            text-align: center;
        }

        .modal-content input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #2b3b4a;
            background: var(--bg-color);
            color: white;
            outline: none;
        }

        .modal-content button {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        /* Чектин ички дизайны */
        .receipt-details {
            background: #0e1621;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
            border: 1px dashed #3a536d;
        }
        
        .receipt-details hr {
            border: none;
            border-top: 1px dashed #3a536d;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- HEADER -->
        <header class="header">
            <div class="header-info">
                <h1>Сотовые аксессуары</h1>
                <p>г. Кара-Балта, ул. Свердлова 51/2</p>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="openAddModal()">➕</button>
            </div>
        </header>

        <!-- PRICE LIST TOGGLE -->
        <div class="price-toggle" onclick="showPriceList()">
            <span>📋 Прайс-листти көрүү / Открыть прайс</span>
            <span>▼</span>
        </div>

        <!-- CHAT AREA -->
        <main class="chat-container" id="chatContainer">
            <div class="message bot">
                Саламатсызбы! Биздин дүкөнгө кош келиңиз. <br>Товардын атын жана санын жазыңыз (мисалы: Чехол iPhone 13 5шт).
            </div>
        </main>

        <!-- INPUT AREA -->
        <div class="input-wrapper">
            <!-- Кардардын атын жазуучу жаңы талаа -->
            <input type="text" class="customer-name-input" id="customerName" placeholder="Кардардын аты (милдеттүү эмес)">
            
            <div class="message-input-row">
                <input type="text" class="input-field" id="messageInput" placeholder="Товар жана саны..." onkeypress="handleEnter(event)">
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>

        <!-- FOOTER -->
        <footer class="footer">
            📞 Байланыш: <span>0556-652-652</span> • <span>0559-656-657</span> (WhatsApp)
        </footer>
    </div>

    <!-- MODAL ДЛЯ ДОБАВЛЕНИЯ ТОВАРА (Админ) -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <h3>Жаңы товар кошуу</h3>
            <input type="text" id="newProductName" placeholder="Товардын аты (мис: Чехол Samsung)">
            <input type="number" id="newProductPrice" placeholder="Баасы (сом менен)">
            <button onclick="addNewProduct()">Сактоо</button>
            <button onclick="closeAddModal()" style="background:#2b3b4a; margin-top:8px;">Жабуу</button>
        </div>
    </div>

    <!-- MODAL ДЛЯ ЧЕКА (Чекти көрүү) -->
    <div class="modal" id="receiptModal">
        <div class="modal-content">
            <h3>🧾 Эсеп-фактура / Чек</h3>
            <div class="receipt-details" id="receiptContent">
                <!-- Чектин маалыматы бул жерге чыгат -->
            </div>
            <button onclick="closeReceiptModal()">Жабуу</button>
        </div>
    </div>

    <script>
        // Базаны localStorage'ден алуу
        let products = JSON.parse(localStorage.getItem('shopProducts')) || [
            { name: 'Чехол iPhone 13', price: 350 },
            { name: 'Защитное стекло', price: 150 },
            { name: 'Наушники TWS', price: 1200 }
        ];

        const chatContainer = document.getElementById('chatContainer');
        
        // Акыркы эсептелген заказды сактоо үчүн (Чек чыгарууга)
        let lastOrder = null; 

        // Билдирүү кошуу функциясы
        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerHTML = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        // Билдирүү жөнөтүү жана эсептөө
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            input.value = '';

            // Жооп берүү логикасы
            setTimeout(() => {
                let found = false;
                let responseText = "Товар табылбады. Прайс-листен так аттарын көрүп, кайра жазыңыз.";

                // Тексттен санды жана товардын атын бөлүп алуу
                const match = text.match(/(.+?)\s*(\d+)\s*(шт|даана|штук)?/i);
                
                if (match) {
                    const searchName = match[1].trim().toLowerCase();
                    const quantity = parseInt(match[2]);

                    const product = products.find(p => p.name.toLowerCase().includes(searchName));

                    if (product) {
                        const total = product.price * quantity;
                        
                        // Кардардын атын алуу
                        let customerName = document.getElementById('customerName').value.trim();
                        if (!customerName) customerName = "Белгисиз кардар";

                        // Чек үчүн маалыматты сактоо
                        lastOrder = {
                            customer: customerName,
                            item: product.name,
                            qty: quantity,
                            price: product.price,
                            total: total,
                            date: new Date().toLocaleString('ru-RU')
                        };

                        responseText = `Эсептелди:<br>• ${product.name}: ${quantity} шт x ${product.price} сом = <b>${total} сом</b><br><br>Жалпы сумма: <b>${total} сом</b><br>
                        <button class="receipt-btn" onclick="showReceipt()">🧾 Чекти көрүү</button>`;
                        found = true;
                    }
                }

                if (!found) {
                    addMessage(responseText, 'bot');
                } else {
                    addMessage(responseText, 'bot');
                }
            }, 400);
        }

        // Чекти көрсөтүү функциясы
        function showReceipt() {
            if (!lastOrder) return;
            
            const receiptHTML = `
                <b>Кардар:</b> ${lastOrder.customer}<br>
                <b>Дата:</b> ${lastOrder.date}<br>
                <hr>
                <b>Товар:</b> ${lastOrder.item}<br>
                <b>Саны:</b> ${lastOrder.qty} шт<br>
                <b>Баасы:</b> ${lastOrder.price} сом<br>
                <hr>
                <b>Жалпы сумма:</b> <span style="color:#2ea6ff; font-size:16px;">${lastOrder.total} сом</span>
            `;
            
            document.getElementById('receiptContent').innerHTML = receiptHTML;
            document.getElementById('receiptModal').style.display = 'flex';
        }

        function closeReceiptModal() {
            document.getElementById('receiptModal').style.display = 'none';
        }

        // Прайс-листти көрсөтүү
        function showPriceList() {
            let priceText = "<b>Биздин прайс-лист:</b><br><br>";
            products.forEach(p => {
                priceText += `• ${p.name} — ${p.price} сом<br>`;
            });
            priceText += "<br><i>Товардын атын жана санын жазыңыз (мисалы: Чехол iPhone 13 2шт).</i>";
            addMessage(priceText, 'bot');
        }

        // Модалды ачуу/жабуу (Админ)
        function openAddModal() { document.getElementById('addModal').style.display = 'flex'; }
        function closeAddModal() { document.getElementById('addModal').style.display = 'none'; }

        // Жаңы товар кошуу
        function addNewProduct() {
            const name = document.getElementById('newProductName').value.trim();
            const price = parseFloat(document.getElementById('newProductPrice').value);

            if (!name || isNaN(price)) {
                alert("Товардын атын жана баасын туура толтуруңуз!");
                return;
            }

            products.push({ name: name, price: price });
            localStorage.setItem('shopProducts', JSON.stringify(products));

            document.getElementById('newProductName').value = '';
            document.getElementById('newProductPrice').value = '';
            closeAddModal();

            addMessage(`✅ Жаңы товар ийгиликтүү кошулду: <b>${name}</b> (${price} сом)`, 'bot');
        }
    </script>
</body>
</html>
