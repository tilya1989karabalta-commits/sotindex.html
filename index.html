<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Тиля - Дүкөн Боту</title>
    <style>
        /* Баардык элементтердин өлчөмүн туура эсептөө үчүн */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            /* Телефондун экранына так батышы үчүн 100dvh колдонобуз */
            height: 100vh;
            height: 100dvh; 
            overflow: hidden; /* Скроллду жашыруу */
        }

        header {
            background-color: #1e293b;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            flex-shrink: 0; /* Header кичирейбеши үчүн */
        }
        header h1 { margin: 0; font-size: 18px; }
        .admin-btn {
            background: #334155;
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 10px;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 15px;
            line-height: 1.4;
            font-size: 14px;
        }
        .bot-message {
            background-color: #1e293b;
            align-self: flex-start;
            border-bottom-left-radius: 0;
        }
        .user-message {
            background-color: #2563eb;
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }

        .input-area {
            background-color: #1e293b;
            padding: 10px;
            padding-bottom: 15px; /* Ылдый жагына кошумча боштук */
            display: flex;
            gap: 8px;
            border-top: 1px solid #334155;
            flex-shrink: 0; /* Жазуу талаасы кичирейбеши үчүн */
            /* iPhone'дордун ылдыйкы сызыгына (Home bar) жолтоо болбошу үчүн */
            padding-bottom: max(15px, env(safe-area-inset-bottom)); 
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border-radius: 20px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: white;
            outline: none;
            font-size: 14px;
        }

        button.send-btn, button.mic-btn {
            border: none;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        button.send-btn { background-color: #2563eb; }
        button.mic-btn { background-color: #10b981; }

        /* Модалдык терезелер (Чек жана Админ) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }
        .modal-content {
            background: white;
            color: black;
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            max-height: 90vh;
            overflow-y: auto;
        }
        .receipt-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 14px;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 5px;
            text-align: left;
        }
        .receipt-total {
            font-weight: bold;
            font-size: 18px;
            margin-top: 10px;
            text-align: right;
        }
        .close-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 12px;
            margin-top: 15px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🤖 Тиля v2.0</h1>
        <button class="admin-btn" onclick="loginAdmin()">🔒 Админ</button>
    </header>

    <div class="chat-container" id="chat-box">
        <div class="message bot-message">
            Салам! Мен Тилямын. Товарларды жана алардын санын үтүр (,) менен бөлүп жазыңыз.<br>
            Мисалы: "Кронштейн 100x125 5шт, местный багет 50м"
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Жазыңыз же микрофонду басыңыз..." onkeypress="handleKeyPress(event)">
        <button class="mic-btn" onclick="startVoiceRecognition()">🎤</button>
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <!-- Чек көрсөтүү терезеси -->
    <div class="modal" id="receipt-modal">
        <div class="modal-content">
            <h3 style="margin-top:0;">🧾 ТИЛЯ ДҮКӨНҮ</h3>
            <p style="font-size:12px; color:gray;">Дареги: Кыргызстан<br>Тел: 0556-652-652</p>
            <div id="receipt-details"></div>
            <div class="receipt-total" id="receipt-total"></div>
            <button class="close-btn" onclick="closeModal('receipt-modal')">Жабуу</button>
        </div>
    </div>

    <!-- Админ панели -->
    <div class="modal" id="admin-modal">
        <div class="modal-content">
            <h3>Админ Панели</h3>
            <p style="text-align:left;">Бааларды оңдоо үчүн коддун ичиндеги <b>priceList</b> объектисинен өзгөртүңүз.</p>
            <button class="close-btn" onclick="closeModal('admin-modal')">Жабуу</button>
        </div>
    </div>

    <script>
        // --- 1. ТОВАРЛАРДЫН БАЗАСЫ (БААЛАРДЫ УШУЛ ЖЕРДЕН ӨЗГӨРТҮҢҮЗ) ---
        const priceList = {
            "кронштейн 100x125": 40,
            "маленкие платформы": 50,
            "местный багет": 150,
            "вставка белая": 100,
            "теневой багет пвх": 120,
            "заглушка на пк-14": 20,
            "карниз пк-14": 250,
            "саморез": 2,
            "гвозди 38": 5,
            "чехол iphone 13": 350,
            "защитное стекло": 150,
            "наушники tws": 1200
        };

        let currentReceiptHTML = "";
        let currentTotal = 0;

        // --- 2. БИЛДИРҮҮ ЖӨНӨТҮҮ ЖАНА ТАЛДОО ---
        function sendMessage() {
            const input = document.getElementById("user-input");
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, "user-message");
            input.value = "";

            processOrder(text);
        }

        function handleKeyPress(e) {
            if (e.key === "Enter") sendMessage();
        }

        function addMessage(text, className) {
            const chatBox = document.getElementById("chat-box");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${className}`;
            msgDiv.innerHTML = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // --- 3. ТЕКСТТИ ТУУРА БӨЛҮП ЭСЕПТӨӨ ЛОГИКАСЫ ---
        function processOrder(text) {
            let items = text.split(/[,\n;]/);
            let total = 0;
            let receiptHTML = "";
            let foundItems = false;

            items.forEach(itemStr => {
                let trimmed = itemStr.trim();
                if (!trimmed) return;

                let match = trimmed.match(/(\d+)\s*(шт|м|кг|даана|рулон)?$/i);

                if (match) {
                    let quantity = parseInt(match[1]);
                    let unit = match[2] ? match[2] : "даана";
                    let rawName = trimmed.substring(0, match.index).trim().toLowerCase();

                    let matchedKey = null;
                    for (let key in priceList) {
                        if (rawName.includes(key) || key.includes(rawName)) {
                            matchedKey = key;
                            break;
                        }
                    }

                    if (matchedKey) {
                        foundItems = true;
                        let price = priceList[matchedKey];
                        let itemTotal = quantity * price;
                        total += itemTotal;
                        
                        receiptHTML += `
                            <div class="receipt-line">
                                <span>${matchedKey} (${quantity} ${unit})</span>
                                <span>${itemTotal} сом</span>
                            </div>`;
                    } else {
                        receiptHTML += `
                            <div class="receipt-line" style="color:red;">
                                <span>Табылган жок: ${rawName}</span>
                                <span>0 сом</span>
                            </div>`;
                    }
                }
            });

            if (!foundItems) {
                addMessage("Кечиресиз, товарлардын атын туура жазыңыз же базада жок экен.", "bot-message");
                speakText("Кечиресиз, товарлар табылган жок.");
                return;
            }

            currentReceiptHTML = receiptHTML;
            currentTotal = total;
            
            let reply = `Эсептелди! Жалпы сумма: <b>${total} сом</b>.<br><br>
                         <button class="admin-btn" onclick="showReceipt()" style="background:#2563eb;">🧾 Чекти көрүү</button>`;
            
            addMessage(reply, "bot-message");
            speakText(`Жалпы сумма ${total} сом`);
        }

        // --- 4. ЧЕКТИ КӨРСӨТҮҮ ---
        function showReceipt() {
            document.getElementById("receipt-details").innerHTML = currentReceiptHTML;
            document.getElementById("receipt-total").innerHTML = `ЖЫЙЫНТЫК: ${currentTotal} сом`;
            document.getElementById("receipt-modal").style.display = "flex";
        }

        function closeModal(id) {
            document.getElementById(id).style.display = "none";
        }

        // --- 5. ҮН МЕНЕН СҮЙЛӨШҮҮ ---
        function startVoiceRecognition() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("Сиздин браузер үн таанууну колдобойт. Chrome колдонуп көрүңүз.");
                return;
            }
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'ru-RU'; 
            recognition.interimResults = false;

            recognition.onstart = function() {
                document.querySelector('.mic-btn').style.backgroundColor = 'red';
            };

            recognition.onresult = function(event) {
                const text = event.results[0][0].transcript;
                document.getElementById("user-input").value = text;
                sendMessage();
            };

            recognition.onend = function() {
                document.querySelector('.mic-btn').style.backgroundColor = '#10b981';
            };

            recognition.start();
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ru-RU';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // --- 6. АДМИН ПАРОЛУ ---
        function loginAdmin() {
            const password = prompt("Админ паролун киргизиңиз:");
            if (password === "admin123") { 
                document.getElementById("admin-modal").style.display = "flex";
            } else {
                alert("Пароль туура эмес!");
            }
        }
    </script>
</body>
</html>
